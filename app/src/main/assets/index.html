<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self';"><title>Daylist</title><link rel="stylesheet" href="style.css">
<header><strong>Daylist</strong><button id="status">Reminders</button></header>
<main><aside id="health" hidden><h2>Reminder settings</h2><button id="notify"></button><button id="alarms"></button><h2>Backup &amp; restore</h2><p id="cloud"></p><div id="backupTools"></div>
<label><input type="checkbox" id="notifyAtDue"> Notify at deadlines</label><label><input type="checkbox" id="enter"> Enter sends a task</label></aside>
<section id="home"><nav id="tabs"></nav><div class="heading"><h1 id="view"></h1><button class="primary" id="add">＋ Task</button></div><div id="list"></div><button id="welcome" hidden>Restore your tasks</button><section id="composer" hidden><textarea id="quick" rows="2" aria-label="New task" placeholder="What needs doing?"></textarea><div id="chips"></div><div class="heading"><button id="attach" aria-label="Edit task details">📎 Details</button><button class="primary" id="send">Send ↑</button></div></section><div id="feedback" aria-live="polite"></div></section>
<form id="editor" hidden><div class="heading"><h1>Task details</h1><button type="button" id="close">Close</button></div>
<label>Task name<input id="title" required maxlength="240"></label><label>Description<textarea id="desc" rows="3"></textarea></label>
<div class="pair"><label>Due date<input type="date" id="date"></label><label>Due time<input type="time" id="time"></label></div>
<label>Explicit reminder time<input type="time" id="reminder"></label><div class="pair"><label>Priority<select id="priority"><option></option><option>Low</option><option>High</option><option>Urgent</option></select></label><label>Tags<input id="tags" placeholder="career, study"></label></div><button id="previewBtn" type="button">Preview Markdown</button><article id="preview" hidden></article><label>Repeat<select id="repeat"><option value="">Once</option><option value="days">Every N days</option><option value="weeks">Weekly on selected days</option><option value="months">Monthly</option></select></label>
<label id="gap">Every how many days?<input type="number" id="interval" value="1" min="1" max="3650"></label><div id="week"></div>
<h2>Subtasks</h2><div id="subs"></div><button type="button" id="addsub">＋ Subtask</button>
<footer><button type="button" id="del">Delete</button><button class="primary">Save task</button></footer></form><p role="alert" id="msg"></p></main><script src="parse.js"></script><script src="app.js"></script><script src="composer.js"></script></html>

plugins { id 'com.android.application' version '8.7.3'; id 'org.jetbrains.kotlin.android' version '1.9.24' }
android {
    buildFeatures { compose true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.14' }
    kotlinOptions { jvmTarget = '1.8' }
    namespace 'dev.daylist'
    compileSdk 35
    defaultConfig { applicationId 'dev.daylist'; minSdk 26; targetSdk 34; versionCode 3; versionName '1.2' }
}
android { compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 } }
dependencies {
 implementation platform('androidx.compose:compose-bom:2024.10.01')
 implementation 'androidx.activity:activity-compose:1.9.3'
 implementation 'androidx.compose.material3:material3'
 implementation 'androidx.compose.material:material-icons-extended'
 implementation 'androidx.compose.animation:animation'
 implementation 'androidx.work:work-runtime:2.9.1'
 implementation 'com.google.android.gms:play-services-auth:21.3.0'
 implementation 'org.commonmark:commonmark:0.22.0'
 implementation 'org.commonmark:commonmark-ext-gfm-tables:0.22.0'
 implementation 'org.commonmark:commonmark-ext-gfm-strikethrough:0.22.0'
 implementation 'org.commonmark:commonmark-ext-task-list-items:0.22.0'
}
if (System.getenv('DAYLIST_KEYSTORE')) {
 android.signingConfigs.create('personal') {
    storeFile file(System.getenv('DAYLIST_KEYSTORE'))
    storePassword System.getenv('DAYLIST_STORE_PASSWORD')
    keyAlias System.getenv('DAYLIST_KEY_ALIAS')
    keyPassword System.getenv('DAYLIST_KEY_PASSWORD')
 }
 android.buildTypes.release.signingConfig = android.signingConfigs.personal
}
dependencies {
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
}

android.defaultConfig.testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
dependencies {
 androidTestImplementation platform('androidx.compose:compose-bom:2024.10.01')
 androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

name: Build Android APK
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: node tests/capture.cjs
      - name: Verify reminder dates
        run: |
          mkdir -p "$RUNNER_TEMP/alarm-dates"
          javac -d "$RUNNER_TEMP/alarm-dates" app/src/main/java/dev/daylist/AlarmDates.java tests/AlarmDatesCheck.java
          java -cp "$RUNNER_TEMP/alarm-dates" dev.daylist.AlarmDatesCheck
      - run: gradle --stacktrace testDebugUnitTest
      - name: Assemble and verify APK
        shell: bash
        env:
          STORE_B64: ${{ secrets.DAYLIST_KEYSTORE_BASE64 }}
          DAYLIST_STORE_PASSWORD: ${{ secrets.DAYLIST_STORE_PASSWORD }}
          DAYLIST_KEY_ALIAS: ${{ secrets.DAYLIST_KEY_ALIAS }}
          DAYLIST_KEY_PASSWORD: ${{ secrets.DAYLIST_KEY_PASSWORD }}
        run: |
          set -eu
          mkdir -p out
          if [[ -n "$STORE_B64" ]]; then
            export DAYLIST_KEYSTORE="$RUNNER_TEMP/daylist.jks"
            printf '%s' "$STORE_B64" | base64 -d > "$DAYLIST_KEYSTORE"
            gradle --stacktrace assembleRelease
            cp app/build/outputs/apk/release/app-release.apk out/Daylist-release.apk
          else
            gradle --stacktrace assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk out/Daylist-debug.apk
          fi
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions out/*.apk | grep -Fq "android.permission.INTERNET"; then
            echo "Unexpected internet permission in built APK" >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs out/*.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/*.apk | grep -E 'package:|application-icon' 
      - uses: actions/upload-artifact@v4
        with:
          name: Daylist-Android
          path: out/*.apk
      - name: Report runner memory on failure
        if: failure()
        run: |
          free -h
          if [[ -r /sys/fs/cgroup/memory.events ]]; then cat /sys/fs/cgroup/memory.events; fi
          if [[ -r /sys/fs/cgroup/memory.max ]]; then cat /sys/fs/cgroup/memory.max; fi
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build app and UI test APKs before starting the emulator
        run: gradle --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash tests/visual.sh --prebuilt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Daylist-UI-checks
          path: |
            visual/
            app/build/reports/androidTests/
      - name: Report runner memory on failure
        if: failure()
        run: |
          free -h
          if [[ -r /sys/fs/cgroup/memory.events ]]; then cat /sys/fs/cgroup/memory.events; fi
          if [[ -r /sys/fs/cgroup/memory.max ]]; then cat /sys/fs/cgroup/memory.max; fi
